name: Deploy Backend (Laravel)

on:
  push:
    branches:
      - 12.x

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SCP code to Backend EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/var/www/backend"
          strip_components: 0

      - name: Copy and execute Apache setup script
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "scripts/setup_apache.sh"
          target: "/var/www/backend/scripts/setup_apache.sh"

      - name: Deploy Laravel Backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/backend

            echo "✅ Set AWS region"
            export AWS_DEFAULT_REGION=us-east-1
            export AWS_REGION=us-east-1

            echo "✅ Install Apache + PHP 8.2"
            sudo apt update
            sudo apt install -y software-properties-common
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt update
            sudo apt install -y \
              apache2 \
              php8.2 libapache2-mod-php8.2 \
              php8.2-cli php8.2-common \
              php8.2-mysql php8.2-zip php8.2-gd \
              php8.2-mbstring php8.2-curl \
              php8.2-xml php8.2-bcmath php8.2-intl

            sudo update-alternatives --set php /usr/bin/php8.2

            echo "✅ Install Composer dependencies"
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "✅ Fetch RDS credentials"
            RDS_CREDS=$(aws secretsmanager get-secret-value \
              --secret-id task/rds/creds \
              --query SecretString \
              --output text)
            DB_USER=$(echo "$RDS_CREDS" | jq -r .username)
            DB_PASS=$(echo "$RDS_CREDS" | jq -r .password)

            echo "✅ Prepare .env"
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            sed -i 's/APP_ENV=.*/APP_ENV=production/' .env
            sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
            sed -i "s|APP_URL=.*|APP_URL=http://${{ secrets.BACKEND_HOST }}|" .env
            sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
            sed -i "s/DB_HOST=.*/DB_HOST=${{ secrets.RDS_ENDPOINT }}/" .env
            sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
            sed -i 's/DB_DATABASE=.*/DB_DATABASE=taskdb/' .env
            sed -i "s/DB_USERNAME=.*/DB_USERNAME=${DB_USER}/" .env
            sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${DB_PASS}/" .env
            chmod 600 .env

            echo "✅ Ensure APP_KEY exists"
            php artisan key:generate --force || true

            echo "✅ Ensure cache table exists (for CACHE_DRIVER=database)"
            php artisan cache:table || true

            echo "✅ Run migrations"
            php artisan migrate --force

            echo "✅ Clear and cache configs"
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache

            echo "✅ Execute Apache setup script"
            sudo bash /var/www/backend/scripts/setup_apache.sh

            echo "🚀 Deployment completed successfully"
