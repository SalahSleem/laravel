name: Deploy Backend (Laravel)

on:
  push:
    branches:
      - 12.x

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SCP code to Backend EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."  # Copy the entire checked-out repo
          target: "/var/www/backend"  # Destination on EC2
          strip_components: 0  # Keep the full directory structure

      - name: Deploy to Backend EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Exit on any error
            cd /var/www/backend
            
            # Check PHP version (require 8.2+ for Laravel 12.x)
            PHP_VERSION=$(php -r "echo PHP_VERSION;")
            if [[ $(echo "$PHP_VERSION < 8.2" | bc -l) -eq 1 ]]; then
              echo "Error: PHP version $PHP_VERSION is too old. Laravel 12.x requires PHP ^8.2. Please upgrade PHP on EC2."
              exit 1
            fi
            
            # Install dependencies
            composer install --no-dev --optimize-autoloader
            
            # Fetch RDS creds from Secrets Manager
            RDS_CREDS=$(aws secretsmanager get-secret-value --secret-id task/rds/creds --query SecretString --output text)
            DB_USER=$(echo $RDS_CREDS | jq -r .username)
            DB_PASS=$(echo $RDS_CREDS | jq -r .password)
            
            # Create/update .env
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            # Uncomment DB lines (in case they are commented in .env.example)
            sed -i 's/# DB_HOST/DB_HOST/' .env
            sed -i 's/# DB_PORT/DB_PORT/' .env
            sed -i 's/# DB_DATABASE/DB_DATABASE/' .env
            sed -i 's/# DB_USERNAME/DB_USERNAME/' .env
            sed -i 's/# DB_PASSWORD/DB_PASSWORD/' .env
            
            # Update .env with production values
            sed -i 's/APP_ENV=.*/APP_ENV=production/' .env
            sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
            sed -i 's|APP_URL=.*|APP_URL=http://'${{ secrets.BACKEND_HOST }}'|' .env
            sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
            sed -i 's/DB_HOST=.*/DB_HOST='${{ secrets.RDS_ENDPOINT }}'/' .env
            sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
            sed -i 's/DB_DATABASE=.*/DB_DATABASE=taskdb/' .env
            sed -i 's/DB_USERNAME=.*/DB_USERNAME='$DB_USER'/' .env
            sed -i 's/DB_PASSWORD=.*/DB_PASSWORD='$DB_PASS'/' .env
            
            # Secure .env file
            chmod 600 .env
            
            # Generate app key and cache config
            php artisan key:generate
            php artisan config:cache
            
            # Clear any old caches
            php artisan cache:clear
            
            # Run migrations
            php artisan migrate --force
            
            # Restart Nginx
            sudo systemctl restart nginx
