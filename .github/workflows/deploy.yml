name: Deploy Backend (Laravel)

on:
  push:
    branches:
      - 12.x

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Copy the shell script from repo to EC2
      - name: Copy setup_apache.sh to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "setup_apache.sh"
          target: "/home/ubuntu/setup_apache.sh"
          strip_components: 0

      # 3️⃣ Deploy Laravel backend
      - name: Deploy to Backend EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/backend

            echo "✅ Set AWS region"
            export AWS_DEFAULT_REGION=us-east-1
            export AWS_REGION=us-east-1

            echo "✅ Install Apache + PHP 8.2"
            sudo apt update
            sudo apt install -y software-properties-common
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt update
            sudo apt install -y apache2 php8.2 libapache2-mod-php8.2 php8.2-cli php8.2-mysql php8.2-zip php8.2-gd php8.2-mbstring php8.2-curl php8.2-xml php8.2-bcmath php8.2-intl
            sudo update-alternatives --set php /usr/bin/php8.2
            sudo a2enmod rewrite
            sudo systemctl restart apache2

            echo "✅ Install Composer dependencies"
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "✅ Ensure .env exists"
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            echo "✅ Fetch DB credentials from AWS Secrets Manager"
            RDS_CREDS=$(aws secretsmanager get-secret-value --secret-id task/rds/creds --query SecretString --output text)
            DB_USER=$(echo "$RDS_CREDS" | jq -r .username)
            DB_PASS=$(echo "$RDS_CREDS" | jq -r .password)

            echo "✅ Update .env with RDS host and credentials"
            sed -i "s|^#*DB_HOST=.*|DB_HOST=${{ secrets.RDS_ENDPOINT }}|" .env
            sed -i "s|^#*DB_DATABASE=.*|DB_DATABASE=taskdb|" .env
            sed -i "s|^#*DB_USERNAME=.*|DB_USERNAME=${DB_USER}|" .env
            sed -i "s|^#*DB_PASSWORD=.*|DB_PASSWORD=${DB_PASS}|" .env
            sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
            sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
            sed -i "s|^APP_URL=.*|APP_URL=http://${{ secrets.BACKEND_HOST }}|" .env
            chmod 600 .env

            echo "✅ Ensure APP_KEY exists"
            php artisan key:generate --force || true

            echo "✅ Run migrations and cache"
            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache

            echo "✅ Apply Apache virtual host from setup_apache.sh"
            sudo bash /home/ubuntu/setup_apache.sh

            sudo systemctl reload apache2

            echo "🚀 Deployment completed successfully"
