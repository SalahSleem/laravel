name: Deploy Backend (Laravel)

on:
  push:
    branches:
      - 12.x  # Ensure this branch exists in https://github.com/SalahSleem/laravel

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Backend EC2
        uses: appleboy/ssh-action@v1.0.0
        env:
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Exit on any error for better debugging
            
            # Log start
            echo "Starting deployment..."
            
            # Ensure /var/www/backend directory exists and is set up
            if [ ! -d /var/www/backend ]; then
              echo "Directory /var/www/backend does not exist. Creating it..."
              sudo mkdir -p /var/www/backend
              sudo chown -R ubuntu:ubuntu /var/www/backend
            fi
            
            cd /var/www/backend
            
            # Check if directory is a Git repo; if not, clone it
            if [ ! -d .git ]; then
              echo "/var/www/backend is not a Git repository. Cloning from GitHub..."
              # Remove any existing non-repo contents to avoid conflicts
              sudo rm -rf /var/www/backend/*
              git clone https://github.com/SalahSleem/laravel.git . || { echo "Git clone failed"; exit 1; }
              git checkout 12.x || { echo "Git checkout to 12.x failed"; exit 1; }
              sudo chown -R ubuntu:ubuntu /var/www/backend
            fi
            
            # Pull latest changes
            git pull origin 12.x || { echo "Git pull failed"; exit 1; }
            
            # Check for composer.json and install dependencies
            if [ ! -f composer.json ]; then
              echo "Error: composer.json not found in repo."
              exit 1
            fi
            composer install --no-dev --optimize-autoloader || { echo "Composer install failed"; exit 1; }
            
            # Fetch RDS creds from Secrets Manager
            RDS_CREDS=$(aws secretsmanager get-secret-value --secret-id task/rds/creds --query SecretString --output text) || { echo "AWS Secrets Manager failed"; exit 1; }
            DB_USER=$(echo $RDS_CREDS | jq -r .username)
            DB_PASS=$(echo $RDS_CREDS | jq -r .password)
            
            # Create/update .env
            if [ ! -f .env.example ]; then
              echo "Error: .env.example not found in repo."
              exit 1
            fi
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            sed -i 's/APP_ENV=.*/APP_ENV=production/' .env
            sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
            sed -i "s|APP_URL=.*|APP_URL=http://$BACKEND_HOST|" .env
            sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
            sed -i "s/DB_HOST=.*/DB_HOST=$RDS_ENDPOINT/" .env
            sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
            sed -i 's/DB_DATABASE=.*/DB_DATABASE=taskdb/' .env
            sed -i "s/DB_USERNAME=.*/DB_USERNAME=$DB_USER/" .env
            sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=$DB_PASS/" .env
            
            # Generate app key and cache config
            php artisan key:generate || { echo "Artisan key:generate failed"; exit 1; }
            php artisan config:cache || { echo "Artisan config:cache failed"; exit 1; }
            
            # Run migrations (force for production)
            php artisan migrate --force || { echo "Artisan migrate failed"; exit 1; }
            
            # Restart Nginx
            sudo systemctl restart nginx || { echo "Nginx restart failed"; exit 1; }
            
            echo "Deployment completed successfully."
